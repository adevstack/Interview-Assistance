name = "ai-interview-prep"
type = "javascript"
account_id = ""
workers_dev = true
compatibility_date = "2023-01-01"
main = "./workers-site/index.js"
node_compat = true

[vars]
FLASK_ENV = "production"

# Setup Python worker for our Flask application
[build]
command = "python download_nltk_data.py"

[build.upload]
format = "modules"
dir = "workers-site"
main = "./index.js"
module_type = "esm"  # Use ESM to avoid the import.meta error

# Route traffic based on path or hostname
[[routes]]
pattern = "*/*"
script = "asgi.py"

# Set environment variables
[env.production]
FLASK_ENV = "production"
DEBUG = "False"
SESSION_COOKIE_SECURE = "True"

[env.production.vars]
# These variables will be set from Cloudflare secrets
DATABASE_URL = ""

# Site configuration - static assets
[site]
bucket = "./app/static"
entry-point = "workers-site"

[triggers]
crons = []
